        title: "一、序章历史背景",
        content: `<p>公元937年七夕，李煜生于金陵。他是南唐中主李璟的第六子，原名李从嘉，字重光。传说他生来一目重瞳——一只眼睛里有两个瞳孔。在史书上，重瞳是圣人之相：仓颉重瞳，虞舜重瞳，项羽重瞳。祖父李昪（南唐烈祖）对这个孙子格外钟爱，曾对身边的人说："此儿有异相，他日必大贵。"</p>
        <p>但李煜自己，从来不想"大贵"。</p>
        <p>南唐地处江南，是五代十国里最富庶、最风雅的一国。烈祖李昪以金陵为都，轻徭薄赋，兴文教，开科举，把江南经营成乱世中的一处桃花源。中主李璟继位后，南唐文风更盛，君臣唱和，词客如云。冯延巳、韩熙载、徐铉......这些名字放在中国文学史上，都是响当当的。李璟本人也是一位词人，那首"细雨梦回鸡塞远，小楼吹彻玉笙寒"，便是他的手笔。</p>
        <p>李煜就生在这样一个地方，这样一个家庭。他的父亲是词人，他的臣子是词人，他身边的人都在写词、弹琴、画画、谈禅。他从小耳濡目染，精书法，善绘画，通音律，工诗词。他本可以做一个富贵闲人，在钟山脚下读书、填词、参禅，像他所仰慕的陶渊明、谢灵运那样过完一生。</p>
        <p>而且，按长幼顺序，皇位根本轮不到他。他的大哥李弘冀，才是那个被立为太子的人。</p>`
      },
      {
        title: "二、历史的拐点",
        content: `<p>李弘冀是一个狠人。史书记载他"为人猜忌严刻"，曾因叔父李景遂威胁到自己的储位，便派人将他毒死。他盯着每一个可能夺位的人，包括那个生有重瞳的弟弟。</p>
        <p>李煜心里清楚。所以他从少年时代起，就刻意远离权力中心。他给自己取号"钟山隐士"，又号"莲峰居士"，在诗里写"一壶酒，一竿纶，世上如侬有几人"，在词里写"花满渚，酒满瓯，万顷波中得自由"。他把自己打扮成一个毫无野心、只爱风月的闲人，既是本心，也是自保。</p>
        <p>可是命运偏偏不肯放过他。显德六年（959年），李弘冀突然病逝。中主李璟悲痛之余，不得不重新考虑储君。长子早亡，次子到五子也相继夭折或早逝，剩下的儿子里，李煜排行第六，却是最年长、最有才、最得中主喜爱的一个。</p>
        <p>于是，这个一心想做隐士的人，被推上了太子的位置。</p>
        <p>建隆二年（961年），李璟迁都洪州（今南昌），李煜留守金陵监国。同年六月，李璟病逝，李煜在金陵即位，改名李煜，是为南唐后主。</p>
        <p>那一年，他二十四岁。从"李从嘉"到"李煜"，不是简单的改名，是命运把一个人劈成了两半：一半留在钟山书斋做隐士，一半走进凤阁龙楼做国主。</p>`

        title: "三、金陵风物志",
        content: `<p>金陵是南唐的国都，也是李煜长大的地方。这座六朝旧都在烈祖李昪的经营下，成为乱世里一处温柔的桃花源——这里没有北方的铁骑与烽烟，只有秦淮河的灯影、钟山的松涛、宫城的管弦和寺庙的钟磬。春天有杏花微雨，夏天有荷风满湖，秋天有梧桐落叶，冬天有寒山暮雪。</p>

          </div>

          </div>
        </div>`
      },
      {
        title: "四、核心人物与典籍",
        content: `<h4>陶渊明与隐逸传统</h4>
        <div class="character-card">
          <p>陶渊明（约365-427），东晋末至南朝宋初诗人，田园诗派鼻祖。他不愿"为五斗米折腰"辞官归隐，躬耕田园的人生理想，是李煜年少时最向往的人生范本——读书、写词、饮酒、参禅，远离宫城纷争。但李煜与陶渊明不同：陶渊明可以主动选择归隐，李煜却连"辞官"的资格都没有，因为他是皇子，命运从不由他选择。</p>
        </div>
        <h4>谢灵运与山水诗</h4>
        <div class="character-card">
          <p>谢灵运（385-433），南朝宋诗人，山水诗派开创者。出身高门士族却仕途坎坷，只能寄情江南山水。李煜读谢灵运，读到的不仅是江南烟霞，更是"才华无处施展、只能寄情风月"的无奈——这种无奈，后来也成了他自己的命运。</p>
        </div>
        <h4>庄子与禅学</h4>
        <div class="character-card">
          <p>庄子是道家学派代表人物，主张顺应自然、超脱名利、齐同万物。李煜在钟山书斋读庄子，与清凉寺僧人谈禅，精神内核与他词中"万顷波中得自由"的追求一脉相承，也是他在权力漩涡中仅存的精神避难所。</p>
        </div>
        <h4>其他核心人物</h4>
        <div class="character-card">
          <h4>中主李璟（父亲）</h4>
          <p>南唐第二位皇帝，也是优秀词人。他生性温和儒雅，好文事轻武功，在李煜少年时就常带他在澄心堂读词写字，是李煜文学上的启蒙者。他那句"词是写给自己看的，江山是给别人看的"，成了李煜一生最矛盾的注脚。</p>
        </div>
        <div class="character-card">
          <h4>太子李弘冀（长兄）</h4>
          <p>李煜长兄，性格严苛猜忌，为巩固储位毒杀叔父李景遂，是李煜少年时最大的阴影。李煜刻意避世、自号钟山隐士，很大程度上就是为了躲避他的猜忌。他的突然病逝，意外改变了李煜一生的命运。</p>
        </div>

          <h4>大周后周娥皇（妻子）</h4>

          <p>李煜同母弟，兄弟二人感情极深。李煜登基后他多次出使北宋，后来被扣留在汴京不得南归，是李煜早期思念亲人、词中愁绪的重要来源。</p>

      {
        title: "五、序章全词作收录",
        content: `<div class="poem-card">
          <h4>《渔父·浪花有意千里雪》· 李煜</h4>
          <p class="poem-text">浪花有意千里雪，桃花无言一队春。<br>一壶酒，一竿纶，世上如侬有几人。</p>
          <div class="poem-translate">
            江上浪花翻滚，仿佛有意化作千里白雪；岸边桃花默默开放，排成长队送来一整个春天。身上只带一壶酒，手里只握一钓竿，像这样逍遥自在的人，这世间能有几个呢？
          </div>
          <p class="poem-note">这是李煜十六岁时为避祸写的明志之作，刻意表现自己只愿做江湖渔父、毫无政治野心，既是自保，也是真心向往。</p>
        </div>
        <div class="poem-card">
          <h4>《渔父·一棹春风一叶舟》· 李煜</h4>
          <p class="poem-text">一棹春风一叶舟，一纶茧缕一轻钩。<br>花满渚，酒满瓯，万顷波中得自由。</p>
          <div class="poem-translate">
            春风里划着一支长桨，坐着一叶小舟；手里拿着一根渔线，系着一枚轻巧的鱼钩。看开满鲜花的小洲，酒杯里倒满美酒，在这万顷碧波之上，我才真正拥有了自由。
          </div>
          <p class="poem-note">写于太子李弘冀病逝前夕，字里行间满是对自由的渴求，却也成了他少年时代最后的奢望。</p>
        </div>
        <div class="poem-card">
          <h4>《摊破浣溪沙·菡萏香销翠叶残》· 李璟</h4>
          <p class="poem-text">菡萏香销翠叶残，西风愁起绿波间。还与韶光共憔悴，不堪看。<br>细雨梦回鸡塞远，小楼吹彻玉笙寒。多少泪珠何限恨，倚阑干。</p>
          <div class="poem-translate">
            荷花落尽香气消散，翠绿的荷叶也已凋残；西风吹过绿波之间，愁绪油然而生。美好的春光和人一同憔悴老去，实在不忍心再看。<br>细雨里从梦中醒来，思念的人远在千里之外；小楼上吹完一曲玉笙，月光清寒。倚着栏杆，流下多少泪珠，藏着多少说不尽的遗恨。
          </div>
          <p class="poem-note">南唐中主李璟的代表作，"细雨梦回鸡塞远，小楼吹彻玉笙寒"是千古名句，也是李煜从小在澄心堂看父亲写得最多的句子。</p>
        </div>
        <div class="poem-card">
          <h4>《浪淘沙·往事只堪哀》· 李煜</h4>
          <p class="poem-text">往事只堪哀，对景难排。秋风庭院藓侵阶。<br>一任珠帘闲不卷，终日谁来。</p>
          <div class="poem-translate">
            想起从前的往事，只让人满心悲哀；面对眼前的景致，这份愁绪也难以排遣。秋风扫过庭院，苔藓已经悄悄爬上了台阶。<br>任凭珠帘垂着也不卷起，从早到晚，又会有谁来看我呢？
          </div>
          <p class="poem-note">登基前夜所作，是少年李从嘉写给自己的挽歌，从这首词开始，他正式与过去的隐士人生告别。</p>
        </div>
        <p class="muted" style="text-indent:0;">说明：本附录仅收录序章时间线内出现的词作，后期亡国后的作品将在对应章节附录中补充。其中"还似旧时游上苑，车如流水马如龙"一句作为命运伏笔预叙引用，原作出自李煜后期《忆江南》。</p>`
      }
    ];

    // 本地存档读取与默认
    function loadState(){
      try {
        const s = localStorage.getItem('liyuGameSave');
        if (!s) return {attr:{poetry:0,power:0,love:0,people:0,sad:0},tags:[], unlockedPoems:[]};
        const state = JSON.parse(s);
        // 补全默认字段
        if(!state.unlockedPoems) state.unlockedPoems = [];
        return state;
      } catch(e){
        console.error('读取存档失败，使用默认值', e);
        return {attr:{poetry:0,power:0,love:0,people:0,sad:0},tags:[], unlockedPoems:[]};
      }
    }

    function saveState(state){
      try {
        localStorage.setItem('liyuGameSave', JSON.stringify(state));
      } catch(e){
        console.warn('存档失败', e);
      }
    }

    function renderSections(){
      const box = document.getElementById('sections');
      box.innerHTML = '';
      sections.forEach((sec, i) => {
        const div = document.createElement('div');
        div.className = 'section';
        // header
        const header = document.createElement('div');
        header.className = 'section-header';
        header.setAttribute('data-index', i);
        header.innerHTML = `<h3>${sec.title}</h3><span class="arrow">▼</span>`;
        header.addEventListener('click', () => toggleSec(header));
        // content
        const content = document.createElement('div');
        content.className = 'section-content';
        content.innerHTML = sec.content;
        div.appendChild(header);
        div.appendChild(content);
        box.appendChild(div);
      });

      // 渲染标记图鉴
      const tagBox = document.getElementById('tagList');
      if (tagBox) {
        const s = loadState();
        tagBox.innerHTML = allTags.map(t => {
          const unlocked = s.tags && s.tags.includes(t);
          return `<span class="tag ${unlocked ? 'tag-unlocked' : 'tag-locked'}" title="${unlocked ? t : '未解锁，通过剧情选择获取'}">${unlocked ? t : '？？？'}</span>`;
        }).join('');
      }
    }

    function toggleSec(header){
      const content = header.nextElementSibling;
      const arrow = header.querySelector('.arrow');
      content.classList.toggle('open');
      arrow.classList.toggle('open');
    }

    function toggleAll(open){
      document.querySelectorAll('.section-content').forEach(c => open ? c.classList.add('open') : c.classList.remove('open'));
      document.querySelectorAll('.arrow').forEach(a => open ? a.classList.add('open') : a.classList.remove('open'));
    }

    // 页面加载时初始化
    document.addEventListener('DOMContentLoaded', () => {
      renderSections();
    });

    // 供开发者在控制台调试使用
    window.__liyu = {
      loadState, saveState, renderSections, allTags
    };
  </script>
