    const STORAGE_KEY = 'liyuGameSave';
    const ATTR_LABELS = { poetry: '词心', power: '龙椅', love: '情缘', people: '民心', sad: '愁绪' };

    function getDefaultState() {
      return {
        attr: { poetry: 0, power: 0, love: 0, people: 0, sad: 0 },
        tags: [],
        currentScene: 0,
        choices: [],
        finished: false
      };
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function normalizeState(raw) {
      const base = getDefaultState();
      if (!raw || typeof raw !== 'object') return base;

      const next = { ...base, ...raw };
      next.attr = { ...base.attr, ...(raw.attr || {}) };
      next.tags = Array.isArray(raw.tags) ? raw.tags.filter(Boolean) : [];
      next.choices = Array.isArray(raw.choices) ? raw.choices : [];
      next.currentScene = Number.isInteger(raw.currentScene) ? raw.currentScene : 0;
      next.finished = !!raw.finished;

      Object.keys(next.attr).forEach((key) => {
        const value = Number(next.attr[key]);
        next.attr[key] = Number.isFinite(value) ? value : 0;
      });

      if (next.currentScene < 0) next.currentScene = 0;
      if (next.currentScene >= storyLines.length) {
        next.currentScene = storyLines.length - 1;
        next.finished = true;
      }
      return next;
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return normalizeState(JSON.parse(saved));
      } catch (e) {
        console.warn('无法读取 localStorage:', e);
      }
      return getDefaultState();
    }

            desc: '你骑马入城。澄心堂里，父亲坐在黑暗中，没有点灯。你跪在他面前。他说：“从嘉，你大哥走了。”你说：“父亲，我……”他说：“你不要说了。我知道你想说什么。你想说，你不想当太子。你想说，你只想写词。你想说，你生来就不是坐龙椅的人。”你低下头。父亲说：“可是从嘉，你看看这满朝文武。你看看这江南的百姓。你看看北方的宋国。你觉得，你能逃到哪里去？”你说不出话。',
            effect: { power: 3 },
            tags: ['宫廷权谋'],
            next: 4
          },
          {
            text: '回到书斋，写一首词，纪念大哥',
            desc: '你回到书斋，提笔，想写一首词。但你写了又撕，撕了又写。你想起大哥的眼神，想起他毒杀叔父的传闻，想起他每一次看你时那种猜忌的目光。你最后写下的，不是悼词，而是一句：“兄弟四人，今余一人。”你把纸揉成一团，扔在地上。你对自己说：从今以后，我再也没有退路了。',
            effect: { poetry: 2, sad: 2 },
            tags: ['孤城夜语'],
            next: 4
          },
          {
            text: '去瑶光殿，找娥皇',
            desc: '你去了瑶光殿。娥皇看见你，什么都没问。她只是给你倒了一杯茶，然后坐在你旁边，握着你的手。你坐了很久。最后你说：“娥皇，我大哥死了。”她说：“我知道。”你说：“我可能要当太子了。”她说：“我知道。”你说：“我不想。”她说：“我知道。”你哭了。你像个孩子一样，伏在她膝上，哭了很久。',
            effect: { sad: 2, love: 1 },
            tags: ['娥皇的陪伴'],
            next: 4
          }
        ]
      },
      {
        title: '第四幕 · 立太子',
        content: `显德六年，大哥死后，父亲立你为太子。
诏书里写的是：“第六子从嘉，仁孝聪敏，雅有文才，可立为太子。”
但你知道，真正的原因不是“仁孝聪敏”。真正的原因是：父亲没有别的选择了。
长子弘冀死了。次子弘茂早夭。三子弘庆、四子弘昉、五子弘雅，也都先后不在。活到成年的儿子里，你最长，也最得父亲喜爱。七弟从善还小，撑不起这个局面。
南唐北有宋国，内有朋党。父亲病重，他需要一个能立刻坐上储位的人。哪怕这个人，只想写词。
建隆二年，父亲病逝于洪州。你跪在灵前，听见群臣在殿外争论。你听见他们说“六皇子仁厚”“六皇子有才”“六皇子是烈祖亲口说过‘他日必大贵’的人”。
你闭上眼睛。你想起很多年前，在钟山书斋里写下的那句：“一壶酒，一竿纶，世上如侬有几人。”
那像是一个遥远的梦。`,
        options: [
          {
            text: '握住父亲的手，答应他',
            desc: '父亲的手很凉。他看着你，说：“从嘉，我要走了。南唐的江山，交给你了。我知道你不想接，但你没有选择。记住我的话：对宋国，要恭顺。不要打仗。能拖一天，是一天。”你哭了。你说：“父亲，我不行。”他说：“你行的。你比你大哥心软，比我有才。只是……只是这个时代，不适合你这样的人。”父亲闭上眼睛。你听见他的呼吸越来越轻。你说：“父亲，我答应你。我会守住南唐。”父亲没有睁眼，但嘴角微微动了一下。',
            effect: { poetry: 2, power: 3 },
            tags: ['父亲的遗命'],
            next: 5
          },
          {
            text: '问父亲，当年祖父说“他日必大贵”，是不是就是这个意思',
            desc: '父亲睁开眼，看了你一眼。他笑了一下，说：“你祖父说的‘大贵’，也许不是皇位。也许……是别的。”你想追问，但父亲已经说不出话了。你跪在床前，反复想着这句话。“也许不是皇位”——那是什么？是词名？是千古流传？你不知道。你只知道，父亲走了。',
            effect: { poetry: 2, sad: 3 },
            tags: ['祖父的预言'],
            next: 5
          },
          {
            text: '什么都不说，只是守着他',
            desc: '你守在父亲床前，一夜没有合眼。天亮的时候，父亲走了。你站起来，觉得整个世界都压在了你肩上。你回到自己的书房。案上，那首没写完的词还在。你提笔，想续上，却怎么也写不出来。你放下笔。你听见殿外群臣的脚步声。他们来找你了。',
            effect: { power: 2, sad: 2 },
            tags: ['无言的继承'],
            next: 5
          }
        ]
      },
      {
        title: '终幕 · 登基前夜',
        content: `登基前夜。你独自站在瑶光殿的台阶上，望着远处的长江。江水东流，无声无息。
        明天，你就要登基了。
今晚，你睡不着。你从寝殿走出来，走到瑶光殿的台阶上。这里是娥皇生前最喜欢的地方。她曾在这里弹琵琶，你曾在这里吹箫。
你望着远处的长江。江水东流，无声无息。你想起父亲的话，想起大哥的死，想起叔父的毒，想起娥皇的笑。
你想起钟山书斋。你想起那首没写完的《渔父》。
你转身回到殿内。案上，那首词还在。你提笔，续上了最后一句：
“还似旧时游上苑，车如流水马如龙。花月正春风。”
你放下笔。你对自己说：李从嘉，从今以后，你不再是那个写《渔父》的少年了。
你是李煜。南唐的国主`,
        options: [
          {
            text: '接受命运',
            desc: '你对自己说：既然逃不掉，那就做吧。但你要按自己的方式做。你想起娥皇说的“不要变成你大哥那样的人”。你对自己说：我不会。',
            effect: { poetry: 5, sad: 1 },
            tags: ['接受命运'],
            next: -1
          },
          {
            text: '閉門沉思，決定以國事壓住舊日情緒',
            desc: '你選擇把終局當成一場必須掌握的命運。',
            effect: { power: 5, people: 1 },
            tags: ['天命未決'],
            next: -1
          },
          {
            text: '睡前寫下幾句溫柔的心事，送給天下與自己',
            desc: '你知道，一個人如果不敢承認自己的軟弱，就永遠無法真心懂人。',
            effect: { love: 4, people: 2 },
            tags: ['歸隱意向'],
            next: -1
          }
        ]
      }
    ];

    let gameState = null;
    let previewMode = false;

    function addTag(tag) {
      const str = String(tag || '').trim();
      if (!str) return;
      if (!gameState.tags.includes(str)) gameState.tags.push(str);
    }

    function applyChoice(opt, scene) {
      if (opt.effect) {
        Object.entries(opt.effect).forEach(([key, value]) => {
          if (gameState.attr[key] !== undefined) {
            gameState.attr[key] += Number(value) || 0;
          }
        });
      }
      if (opt.tags) opt.tags.forEach(addTag);

      gameState.choices.push({
        sceneTitle: scene.title,
        narration: scene.content,
        choiceText: opt.text,
        choiceDesc: opt.desc,
        effect: opt.effect,
        tags: opt.tags
      });

      gameState.currentScene = opt.next;
      if (opt.next === -1) {
        gameState.finished = true;
        addTag('序章珍藏');
      }
      saveState();
    }

    function formatEffect(effect) {
      if (!effect) return '';
      return Object.entries(effect)
        .map(([k, v]) => `${ATTR_LABELS[k] || k} ${v > 0 ? '+' : ''}${v}`)
        .join(' / ');
    }

    function getEnding() {
      const a = gameState.attr;
      const ranked = [
        ['poetry', '你最终选择以词心映照山河，把一生的悲欢都写进词句里。千年之后，帝王将相的功业终将随风散去，而你的词作会永远留在世间，成为后人低声吟诵的温柔。'],
        ['power', '你收起了词人的柔软，选择扛起南唐国主的重担。深宫的灯火长明，你将在权谋与国运的漩涡中走出属于自己的帝王之路。'],
        ['love', '你始终以温柔之心待世间人，不论是身边的爱人、朝中的臣子还是境内的百姓，都感受过你的赤诚。温柔是你最强的力量。'],
        ['people', '你始终把百姓放在心上，宁可自己为难，也不肯让江南多一户流离的人家。多年以后，人们仍会因为你的仁政而低声称道。'],
        ['sad', '你在矛盾与挣扎中走完了序章，愁绪深深刻进了生命里。这份敏感与惆怅，最终成为你词作里最动人的底色。']
      ];
      let best = ranked[0];
      ranked.forEach(item => { if (a[item[0]] > a[best[0]]) best = item; });
      return best[1];
    }

    /* ================= 人生轨迹渲染 ================= */
    function renderJourney() {
      const a = gameState.attr;
      const choices = gameState.choices;
      const total = storyLines.length;
      
      let timelineHtml = '';
      choices.forEach((item, idx) => {
        let effectHtml = '';
        if (item.effect) {
          effectHtml = '<p style="font-size:12px;color:#b45309;margin-top:8px;margin-bottom:0;">属性变化：' + formatEffect(item.effect) + '</p>';
        }
        let tagHtml = '';
        if (item.tags && item.tags.length) {
          tagHtml = '<div class="tag-group">' + item.tags.map(t => '<span class="tag">' + escapeHtml(t) + '</span>').join('') + '</div>';
        }
        timelineHtml += '<div class="timeline-card scene-card">' +
          '<div class="timeline-head">' +
            '<div class="scene-badge">' + (idx + 1) + '</div>' +
            '<h4 class="timeline-title">' + escapeHtml(item.sceneTitle) + '</h4>' +
          '</div>' +
          '<p class="timeline-narration">' + escapeHtml(item.narration) + '</p>' +
          '<div class="choice-box">' +
            '<strong>你的选择：</strong>' +
            '<p style="font-weight:500;color:#78350f;margin-bottom:6px;">' + escapeHtml(item.choiceText) + '</p>' +
            '<p style="font-size:14px;">' + escapeHtml(item.choiceDesc) + '</p>' +
            effectHtml +
          '</div>' +
          tagHtml +
        '</div>';
      });

      const titleText = gameState.finished ? '序章终局' : '人生轨迹回顾';
      const descText = gameState.finished ? '你已经走完了李煜序章的全部旅程，以下是你做出的所有选择。' : '你已完成 ' + choices.length + ' / ' + total + ' 幕，以下为你已走过的轨迹。';
      let progressHtml = '';
      if (!gameState.finished) {
        const percent = Math.round((choices.length / total) * 100);
        progressHtml = '<p class="progress-tip">进度：' + percent + '%</p><div class="progress-bar"><div class="progress-fill" style="width:' + percent + '%"></div></div>';
      }

      let finalHtml = '';
      if (gameState.finished) {
        const tagsHtml = gameState.tags.map(t => '<span class="tag">' + escapeHtml(t) + '</span>').join('');
        finalHtml = '<div class="final-card scene-card">' +
          '<h3 style="text-align:center;font-size:24px;margin-top:0;">序章结局</h3>' +
          '<div class="final-attr-grid">' +
            '<div class="final-attr-item"><p class="name">词心</p><p class="val">' + a.poetry + '</p></div>' +
            '<div class="final-attr-item"><p class="name">龙椅</p><p class="val">' + a.power + '</p></div>' +
            '<div class="final-attr-item"><p class="name">情缘</p><p class="val">' + a.love + '</p></div>' +
            '<div class="final-attr-item"><p class="name">民心</p><p class="val">' + a.people + '</p></div>' +
            '<div class="final-attr-item"><p class="name">愁绪</p><p class="val">' + a.sad + '</p></div>' +
          '</div>' +
          '<p class="ending-text">' + getEnding() + '</p>' +
          '<div class="tag-group" style="justify-content:center;">' + tagsHtml + '</div>' +
        '</div>';
      }

      let backBtnHtml = '';
      if (!gameState.finished) backBtnHtml = '<button class="btn btn-primary" id="backGameBtn">返回继续游玩</button>';

      const main = document.getElementById('mainContent');
      main.innerHTML = '<div class="scene-card" style="text-align:center;margin-bottom:32px;">' +
        '<h2 style="font-size:32px;margin:0 0 12px;">' + titleText + '</h2>' +
        '<p style="color:#78716c;margin:0;">' + descText + '</p>' +
        progressHtml +
        '</div>' +
        timelineHtml +
        finalHtml +
        '<div class="controls-row">' +
          backBtnHtml +
          '<button class="btn btn-danger" onclick="restartGame()">重新开始序章</button>' +
        '</div>';

      const backBtn = document.getElementById('backGameBtn');
      if (backBtn) {
        backBtn.onclick = () => {
          previewMode = false;
          renderScene();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
      }
    }

    /* ================= 游玩视图 ================= */
    function renderScene() {
      const scene = storyLines[gameState.currentScene];
      if (!scene) {
        gameState.finished = true;
        saveState();
        renderJourney();
        return;
      }
      const total = storyLines.length;
      const current = gameState.currentScene + 1;
      const percent = Math.round((gameState.currentScene / total) * 100);
      const cardClass = scene.title.indexOf('楔子') === 0 ? 'bg-amber50' : 'bg-stone50';
      const previewDisabled = gameState.choices.length ? '' : 'disabled';

      const main = document.getElementById('mainContent');
      main.innerHTML = '<div class="scene-card" style="text-align:center;margin-bottom:32px;">' +
        '<h2 style="font-size:32px;margin:0 0 12px;">序章 · 重瞳·钟山隐</h2>' +
        '<p style="color:#78716c;margin:0;">你正在书写李煜的前半段命运，每一个选择都将塑造他的人生轨迹。</p>' +
        '<p class="progress-tip">第 ' + current + ' 幕 / 共 ' + total + ' 幕</p>' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + percent + '%"></div></div>' +
        '</div>' +
        '<div class="' + cardClass + ' scene-card">' +
          '<h3 style="font-size:26px; margin:0 0 20px; line-height:1.4;">' + escapeHtml(scene.title) + '</h3>' +
          '<p style="font-size:17px;color:#44403c;margin:0; white-space:pre-wrap; line-height:2;">' + escapeHtml(scene.content) + '</p>' +
        '</div>' +
        '<div id="optBox" style="margin-top:32px;"></div>' +
        '<div class="controls-row">' +
          '<button class="btn btn-secondary" id="previewBtn" ' + previewDisabled + '>回顾已走过的轨迹</button>' +
          '<button class="btn btn-danger" onclick="restartGame()">重新开始序章</button>' +
        '</div>';

      const box = document.getElementById('optBox');
      scene.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        let btnContent = '<span style="font-weight:500;font-size:18px;display:block;">' + escapeHtml(opt.text) + '</span>';
        if (opt.desc) btnContent += '<p style="font-size:14px;color:#78716c;margin:8px 0 0 0;">' + escapeHtml(opt.desc) + '</p>';
        if (opt.effect) btnContent += '<p style="font-size:12px;color:#92400e;margin:10px 0 0 0;">属性变化：' + formatEffect(opt.effect) + '</p>';
        btn.innerHTML = btnContent;
        btn.onclick = () => {
          document.querySelectorAll('.choice-btn').forEach((b) => { b.disabled = true; });
          applyChoice(opt, scene);
          setTimeout(() => {
            if (gameState.finished) {
              previewMode = false;
              renderJourney();
            } else {
              renderScene();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }, 450);
        };
        box.appendChild(btn);
      });

      const previewBtn = document.getElementById('previewBtn');
      if (previewBtn) {
        previewBtn.onclick = () => {
          previewMode = true;
          renderJourney();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
      }
    }

    /* ================= 页面初始化 ================= */
    document.addEventListener('DOMContentLoaded', () => {
      gameState = loadState();
      if (gameState.finished || previewMode) {
        renderJourney();
      } else {
        renderScene();
      }
    });
  </script>
</body>
</html>
