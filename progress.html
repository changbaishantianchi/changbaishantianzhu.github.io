  <script>
    const STORAGE_KEY = 'liyuGameSave';
    const ATTR_LABELS = {
      poetry: '词心',
      power: '龙椅',
      love: '情缘',
      people: '民心',
      sad: '愁绪'
    };

    function getDefaultState() {
      return {
        attr: { poetry: 0, power: 0, love: 0, people: 0, sad: 0 },
        tags: [],
        currentScene: 0,
        choices: [],
        started: true,
        finished: false
      };
    }

    function normalizeState(raw) {
      const base = getDefaultState();
      if (!raw || typeof raw !== 'object') return base;

      const next = { ...base, ...raw };
      next.attr = { ...base.attr, ...(raw.attr || {}) };
      next.tags = Array.isArray(raw.tags) ? raw.tags.filter(Boolean) : [];
      next.choices = Array.isArray(raw.choices) ? raw.choices : [];
      next.currentScene = Number.isInteger(raw.currentScene) ? raw.currentScene : 0;
      next.finished = !!raw.finished;

      Object.keys(next.attr).forEach((key) => {
        const value = Number(next.attr[key]);
        next.attr[key] = Number.isFinite(value) ? value : 0;
      });

      if (next.currentScene < 0) next.currentScene = 0;
      if (next.currentScene >= storyLines.length) {
        next.currentScene = storyLines.length - 1;
        next.finished = true;
      }

      return next;
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return normalizeState(JSON.parse(saved));
      } catch (e) {
        console.warn('无法读取 localStorage:', e);
      }
      return getDefaultState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
      } catch (e) {
        console.warn('无法写入 localStorage:', e);
      }
      updateUI();
    }

    function clearState() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {
        console.warn('无法清除 localStorage:', e);
      }
    }

    function restartGame() {
      if (confirm('确定要重新开始序章吗？当前所有进度和选择将会被清空。')) {
        clearState();
        window.location.reload();
      }
    }

    function updateUI() {
      const poetry = document.getElementById('attr-poetry');
      const power = document.getElementById('attr-power');
      const love = document.getElementById('attr-love');
      const people = document.getElementById('attr-people');
      const sad = document.getElementById('attr-sad');
      const tagCount = document.getElementById('tagCount');

      if (poetry) poetry.textContent = String(gameState.attr.poetry ?? 0);
      if (power) power.textContent = String(gameState.attr.power ?? 0);
      if (love) love.textContent = String(gameState.attr.love ?? 0);
      if (people) people.textContent = String(gameState.attr.people ?? 0);
      if (sad) sad.textContent = String(gameState.attr.sad ?? 0);
      if (tagCount) tagCount.textContent = String(gameState.tags.length ?? 0);
    }

    const storyLines = [
      {
        title: '楔子 · 重瞳降生',
        content: `公元937年，七夕。金陵宫城，梧桐未落。你在“重瞳”之名中降生，既被看作天命，也被当作一场风波。
旁白：婴儿啼哭声还未散，舆论与期望已先到庭。有人在窗外低语：若有重瞳，便是非常；有人在殿内轻叹：凡人难承。
你站在命运的门口，第一次知道——身份会在无形中替你定下行径的边界，也会替你带来额外的注视。父辈的旧书、宫中的暗影、乡间老屋里的碎语，都像一枚枚正在发芽的种子，等待你去决定它们最终长成什么模样。
旁白：在你幼年，文字与权力都像两条并行的小路，谁也不肯先退一步。你可以选择让心停在诗句里，也可以选择早早把目光投向权势与家族。
（这一段是序章的起点，它为后续选择埋下了情感与志向的基调。）`,
        options: [
          {

            effect: { power: 2 },

          {
            text: '在兄弟间留心亲情与旧爱',
            desc: '你明白情分会比权谋更早地伤人。',
            effect: { love: 2 },

      {
        title: '过渡一 · 雨停辞山',
        content: `年少的你，在风雨中读过许多信札。某个夜里，你在烛光下看见兄长与朋友的字句，既有温暖也有锋利。那一页页信笺像从前路折回的针，轻轻扎在心口，提醒你：人在世间，既被期待，也会被误解。
旁白：雨声像节拍，敲出许多思索——若只会写词，能否担起家国重任？若把秘密藏起，是否等于割裂自己的一部分？
你体会到选择不仅影响自己，也会把别人和未来织进你的故事里。此刻的决定，会随着时间成为记忆的一部分，或是一道永远无法抹去的疤痕。
旁白：面临信件与责任，你选择了如何回应：毁去过往、压抑心事，或直面权力与父亲的期望？`,
        options: [
          {
            text: '烧掉大哥的信，亲手写下《渔父词》明志',

          {
            text: '把信压在书案最底层，假装什么都没发生',

        content: `归城之后，瑶光殿的琵琶声如影随形：既惊艳又易碎。宫中人称赞你的才情，也暗地议论你的身份与未来。你意识到，光环与流言，总是会从最意外的地方落在耳边。

        options: [

你站在风口浪尖，知道沉默或冲锋都会被解读。于是你权衡：压抑悲伤、以行动争取话语权；或将内心吐于文字，以诗句处理痛苦；抑或去探访旧友、了解人心变化，决定未来垂直于何处。

            text: '闭门沉思，决定以国事压住旧日情绪',
            desc: '你选择把终局当成一场必须掌握的命运。',
            effect: { power: 5, people: 1 },
            tags: ['圣主之志'],
            next: -1
          },
          {
            text: '睡前写下几句温柔的心事，送给天下与自己',
            desc: '你知道，一个人如果不敢承认自己的软弱，就永远无法真心懂人。',
            effect: { love: 4, people: 2 },
            tags: ['温柔与人心'],
            next: -1
          }
        ]
      }
    ];

    function addTag(tag) {
      const str = String(tag || '').trim();
      if (!str) return;
      if (!gameState.tags.includes(str)) {
        gameState.tags.push(str);
      }
    }

    function applyChoice(opt, scene) {
      if (!gameState.choices) {
        gameState.choices = [];
      }

      if (opt.effect) {
        Object.entries(opt.effect).forEach(([key, value]) => {
          if (gameState.attr[key] !== undefined) {
            gameState.attr[key] += Number(value) || 0;
          }
        });
      }

      if (opt.tags) {
        opt.tags.forEach(addTag);
      }

      gameState.choices.push({
        sceneIndex: gameState.currentScene,
        sceneTitle: scene.title,
        sceneContent: scene.content,
        choiceText: opt.text,
        choiceDesc: opt.desc,
        choiceEffect: opt.effect,
        choiceTags: opt.tags,
        timestamp: new Date().toISOString()
      });
    }

    function renderScene() {
      const container = document.getElementById('storyContainer');
      const journeySection = document.getElementById('journeySection');
      if (!container) return;

      const scene = storyLines[gameState.currentScene];
      if (!scene) {
        gameState.finished = true;
        saveState();
        renderJourney();
        return;
      }

      if (journeySection) journeySection.style.display = 'none';

      container.innerHTML = `
        <div class="text-center scene-card" style="margin-bottom:48px;text-align:center;">
          <h2 style="font-size:30px;margin-bottom:12px;">序章 · 交互式人生轨迹</h2>
          <p style="color:#78716c;margin:0;">你正在书写李煜的前半段命运，选择将决定你的指向。</p>
          <p style="color:#b45309;font-size:15px;margin:8px 0 0 0;">第 ${gameState.currentScene + 1} 幕 / 共 ${storyLines.length} 幕</p>
        </div>
        <div class="${scene.title.includes('楔子') ? 'bg-amber50' : 'bg-stone50'} scene-card">
          <h3 style="font-size:28px; margin:0 0 16px; line-height:1.4;">${scene.title}</h3>
          <p style="font-size:18px;color:#44403c;margin:0; white-space:pre-wrap; line-height:1.9;">${scene.content}</p>
        </div>
        <div id="optBox" style="margin-top:32px;"></div>
      `;

      const box = document.getElementById('optBox');
      scene.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = `
          <span style="font-weight:500;font-size:18px;display:block;">${escapeHtml(opt.text)}</span>
          ${opt.desc ? `<p style="font-size:14px;color:#78716c;margin:8px 0 0 0;">${escapeHtml(opt.desc)}</p>` : ''}
          ${opt.effect ? `<p style="font-size:12px;color:#92400e;margin:10px 0 0 0;">属性变化：${Object.entries(opt.effect).map(([k, v]) => {
            return `${ATTR_LABELS[k] || k}: ${v > 0 ? '+' : ''}${v}`;
          }).join(' / ')}</p>` : ''}
        `;

        btn.onclick = () => {
          document.querySelectorAll('.choice-btn').forEach((b) => b.disabled = true);
          applyChoice(opt, scene);

          gameState.currentScene = opt.next;
          if (opt.next === -1) {
            gameState.finished = true;
          }

          saveState();

          setTimeout(() => {
            if (gameState.finished) {
              renderJourney();
            } else {
              window.location.reload();
            }
          }, 500);
        };

        box.appendChild(btn);
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
      setActiveNav('nav-progress');
    }

    function renderJourney() {
      const container = document.getElementById('storyContainer');
      const journeySection = document.getElementById('journeySection');
      if (!journeySection) return;

      const attrHtml = `
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
          <div class="journey-badge">词心: ${gameState.attr.poetry}</div>
          <div class="journey-badge">龙椅: ${gameState.attr.power}</div>
          <div class="journey-badge">情缘: ${gameState.attr.love}</div>
          <div class="journey-badge">民心: ${gameState.attr.people}</div>
          <div class="journey-badge">愁绪: ${gameState.attr.sad}</div>
        </div>
        <div style="margin-bottom:8px;">
          已收集标记：${gameState.tags.length > 0 ? gameState.tags.map((t) => `<span class="journey-badge">${escapeHtml(String(t))}</span>`).join('') : '<span style="color:#78716c;">（无）</span>'}
        </div>
      `;

      let historyHtml = '';
      if (!gameState.choices || gameState.choices.length === 0) {
        historyHtml = '<p style="color:#78716c;">你还没有做出任何选择。返回序章开始你的旅程。</p>';
      } else {
        historyHtml = gameState.choices.map((c, idx) => {
          const effectText = c.choiceEffect ? Object.entries(c.choiceEffect).map(([k, v]) => {
            return `${ATTR_LABELS[k] || k}: ${v > 0 ? '+' : ''}${v}`;
          }).join(' / ') : '';

          const tagsHtml = c.choiceTags && c.choiceTags.length ? c.choiceTags.map((t) => `<span class="journey-badge">${escapeHtml(String(t))}</span>`).join('') : '';

          let timeText = '时间未知';
          if (c.timestamp) {
            const parsed = Date.parse(c.timestamp);
            if (!isNaN(parsed)) {
              timeText = new Date(parsed).toLocaleString();
            }
          }

          return `
            <div class="journey-item">
              <strong>第 ${idx + 1} 步 · ${escapeHtml(c.sceneTitle || '剧情')}</strong>
              <div class="journey-meta">${timeText}</div>
              <p style="margin:8px 0 6px 0;color:#444;">${escapeHtml(c.sceneContent || '').slice(0, 240)}${(c.sceneContent || '').length > 240 ? '…' : ''}</p>
              <div style="margin-top:8px;">
                <div style="font-weight:500;color:#92400e;">你的选择：${escapeHtml(c.choiceText || '')}</div>
                ${c.choiceDesc ? `<div style="color:#78716c;margin-top:6px;">${escapeHtml(c.choiceDesc)}</div>` : ''}
                ${effectText ? `<div style="margin-top:8px;color:#78350f;font-size:13px;">属性变化：${effectText}</div>` : ''}
                <div style="margin-top:8px;">${tagsHtml}</div>
              </div>
            </div>
          `;
        }).join('');
      }

      const finishedNote = gameState.finished
        ? '<p style="color:#92400e;font-weight:500;margin-top:6px;">当前已完成序章，可在下方查看完整回顾或选择重新开始。</p>'
        : '<p style="color:#78716c;margin-top:6px;">序章尚未完成，你可以返回继续选择，或导出当前存档备份。</p>';

      journeySection.innerHTML = `
        <div class="text-center scene-card" style="margin-bottom:18px;text-align:center;">
          <h2 style="font-size:28px;margin-bottom:8px;">人生轨迹 · 回顾</h2>
          <p style="color:#78716c;margin:0;">在此查看你在序章中所做出的选择、属性变化与收集到的标记。</p>
        </div>
        <div class="bg-stone50 scene-card">
          <h3 style="font-size:22px;margin-top:0;">属性与标记</h3>
          ${attrHtml}
          ${finishedNote}
          <div class="controls-row">
            <button class="small-btn" onclick="exportSave()">导出存档</button>
            <button class="small-btn" onclick="resumeFromJourney()">返回序章</button>
            <button class="small-btn" onclick="restartGame()">重置并重新开始</button>
          </div>
        </div>
        <div style="margin-top:24px;">
          <h3 style="font-size:22px;margin-bottom:12px;">选择历史</h3>
          ${historyHtml}
        </div>
      `;

      if (container) container.innerHTML = '';
      journeySection.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setActiveNav('nav-journey');
    }

    function resumeFromJourney() {
      if (gameState.finished) {
        gameState.currentScene = Math.max(0, storyLines.length - 1);
        gameState.finished = false;
        saveState();
      }
      renderScene();
    }

    function exportSave() {
      try {
        const dataStr = JSON.stringify(gameState, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `liyuGameSave_${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch (e) {
        alert('导出失败：' + e.message);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function setActiveNav(id) {
      document.querySelectorAll('.nav-item').forEach((n) => n.classList.remove('active'));
      const el = document.getElementById(id);
      if (el) el.classList.add('active');
    }

    let gameState = loadState();

    function initPage() {
      updateUI();
      if (gameState.finished) {
        renderJourney();
      } else {
        renderScene();
      }
    }

    document.getElementById('nav-journey').addEventListener('click', function (event) {
      event.preventDefault();
      renderJourney();
    });

    initPage();
  </script>
</body>
</html>
