  <script>
    const STORAGE_KEY = 'liyuGameSave';
    const ATTR_LABELS = { poetry: '词心', power: '龙椅', love: '情缘', people: '民心', sad: '愁绪' };

    function getDefaultState() {
      return {
        attr: { poetry: 0, power: 0, love: 0, people: 0, sad: 0 },
        tags: [],
        currentScene: 0,
        choices: [],
        finished: false
      };
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function normalizeState(raw) {
      const base = getDefaultState();
      if (!raw || typeof raw !== 'object') return base;

      const next = { ...base, ...raw };
      next.attr = { ...base.attr, ...(raw.attr || {}) };
      next.tags = Array.isArray(raw.tags) ? raw.tags.filter(Boolean) : [];
      next.choices = Array.isArray(raw.choices) ? raw.choices : [];
      next.currentScene = Number.isInteger(raw.currentScene) ? raw.currentScene : 0;
      next.finished = !!raw.finished;

      Object.keys(next.attr).forEach((key) => {
        const value = Number(next.attr[key]);
        next.attr[key] = Number.isFinite(value) ? value : 0;
      });

      if (next.currentScene < 0) next.currentScene = 0;
      if (next.currentScene >= storyLines.length) {
        next.currentScene = storyLines.length - 1;
        next.finished = true;
      }
      return next;
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return normalizeState(JSON.parse(saved));
      } catch (e) {
        console.warn('无法读取 localStorage:', e);
      }
      return getDefaultState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
      } catch (e) {
        console.warn('无法写入 localStorage:', e);
      }
    }

      if (!confirm('确定要重新开始序章吗？当前所有进度和选择将会被清空。')) return;

            text: '闭门沉思，决定以国事压住旧日情绪',
            desc: '你选择把终局当成一场必须掌握的命运。',
            effect: { power: 5, people: 1 },
            tags: ['天命未决'],
            next: -1
          },
          {
            text: '睡前写下几句温柔的心事，送给天下与自己',
            desc: '你知道，一个人如果不敢承认自己的软弱，就永远无法真心懂人。',
            effect: { love: 4, people: 2 },
            tags: ['归隐意向'],
            next: -1
          }
        ]
      }
    ];

    let gameState = null;
    let previewMode = false;

    function addTag(tag) {
      const str = String(tag || '').trim();
      if (!str) return;
      if (!gameState.tags.includes(str)) gameState.tags.push(str);
    }

    function applyChoice(opt, scene) {
      if (opt.effect) {
        Object.entries(opt.effect).forEach(([key, value]) => {
          if (gameState.attr[key] !== undefined) {
            gameState.attr[key] += Number(value) || 0;
          }
        });
      }
      if (opt.tags) opt.tags.forEach(addTag);

      gameState.choices.push({
        sceneTitle: scene.title,
        narration: scene.content,
        choiceText: opt.text,
        choiceDesc: opt.desc,
        effect: opt.effect,
        tags: opt.tags
      });

      gameState.currentScene = opt.next;
      if (opt.next === -1) {
        gameState.finished = true;
        addTag('序章珍藏');
      }
      saveState();
    }

    function formatEffect(effect) {
      if (!effect) return '';
      return Object.entries(effect)
        .map(([k, v]) => `${ATTR_LABELS[k] || k} ${v > 0 ? '+' : ''}${v}`)
        .join(' / ');
    }

    function getEnding() {
      const a = gameState.attr;
      const ranked = [
        ['poetry', '你最终选择以词心映照山河，把一生的悲欢都写进词句里。千年之后，帝王将相的功业终将随风散去，而你的词作会永远留在世间，成为一代词帝的永恒注脚。'],
        ['power', '你收起了词人的柔软，选择扛起南唐国主的重担。深宫的灯火长明，你将在权谋与国运的漩涡中走出属于自己的帝王之路，是守成还是开拓，前路皆在你手中。'],
        ['love', '你始终以温柔心待世间人，不论是身边的爱人、朝中的臣子还是境内的百姓，都感受过你的赤诚。哪怕风雨欲来，这份柔软也会成为你最坚韧的力量。'],
        ['people', '你始终把百姓放在心上，宁可自己为难，也不肯让江南多一户流离的人家。多年以后，金陵的巷陌之间，仍有人念起你名字时的一声叹息。'],
        ['sad', '你在矛盾与挣扎中走完了序章，愁绪深深刻进了生命里。这份敏感与惆怅，最终会成为你词作里最动人的底色，也成为你一生解不开的结。']
      ];
      let best = ranked[0];
      ranked.forEach(item => { if (a[item[0]] > a[best[0]]) best = item; });
      return best[1];
    }

    /* ================= 游玩视图 ================= */
    function renderScene() {
      const scene = storyLines[gameState.currentScene];
      if (!scene) {
        gameState.finished = true;
        saveState();
        renderJourney();
        return;
      }
      const total = storyLines.length;
      const current = gameState.currentScene + 1;
      const percent = Math.round((gameState.currentScene / total) * 100);

      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="scene-card" style="text-align:center;margin-bottom:32px;">
          <h2 style="font-size:32px;margin:0 0 12px;">序章 · 重瞳·钟山隐</h2>
          <p style="color:#78716c;margin:0;">你正在书写李煜的前半段命运，每一个选择都将塑造他的人生轨迹。</p>
          <p class="progress-tip">第 ${current} 幕 / 共 ${total} 幕</p>
          <div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div>
        </div>
        <div class="${scene.title.indexOf('楔子') === 0 ? 'bg-amber50' : 'bg-stone50'} scene-card">
          <h3 style="font-size:26px; margin:0 0 20px; line-height:1.4;">${escapeHtml(scene.title)}</h3>
          <p style="font-size:17px;color:#44403c;margin:0; white-space:pre-wrap; line-height:2;">${escapeHtml(scene.content)}</p>
        </div>
        <div id="optBox" style="margin-top:32px;"></div>
        <div class="controls-row">
          <button class="btn btn-secondary" id="previewBtn" ${gameState.choices.length ? '' : 'disabled'}>回顾已走过的轨迹</button>
          <button class="btn btn-primary" onclick="restartGame()">重新开始序章</button>
        </div>
      `;

      const box = document.getElementById('optBox');
      scene.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = `
          <span style="font-weight:500;font-size:18px;display:block;">${escapeHtml(opt.text)}</span>
          ${opt.desc ? `<p style="font-size:14px;color:#78716c;margin:8px 0 0 0;">${escapeHtml(opt.desc)}</p>` : ''}
          ${opt.effect ? `<p style="font-size:12px;color:#92400e;margin:10px 0 0 0;">属性变化：${formatEffect(opt.effect)}</p>` : ''}
        `;
        btn.onclick = () => {
          document.querySelectorAll('.choice-btn').forEach((b) => { b.disabled = true; });
          applyChoice(opt, scene);
          setTimeout(() => {
            if (gameState.finished) {
              previewMode = false;
              renderJourney();
            } else {
              renderScene();
            }
          }, 450);
        };
        box.appendChild(btn);
      });

      const previewBtn = document.getElementById('previewBtn');
      if (previewBtn) {
        previewBtn.onclick = () => { previewMode = true; renderJourney(); };
      }
      window.scrollTo(0, 0);
    }

    /* ================= 人生轨迹视图（已并入本页） ================= */
    function renderJourney() {
      const main = document.getElementById('mainContent');

      let timelineHtml = '';
      if (!gameState.choices.length) {
        timelineHtml = `<div style="text-align:center;padding:48px;color:#78716c;background:#ffffff;border-radius:12px;">你还没有做出任何选择，先回到序章开始你的旅程吧。</div>`;
      } else {
        timelineHtml = gameState.choices.map((item, idx) => `
          <article class="timeline-card">
            <div class="timeline-head">
              <div class="scene-badge">${idx + 1}</div>
              <h4 class="timeline-title">${escapeHtml(item.sceneTitle)}</h4>
            </div>
            <p class="timeline-narration">${escapeHtml(item.narration)}</p>
            <div class="choice-box">
              <strong>你的选择</strong>
              <p>${escapeHtml(item.choiceText)}</p>
              ${item.choiceDesc ? `<p style="font-size:14px;color:#78716c;margin-top:6px;">${escapeHtml(item.choiceDesc)}</p>` : ''}
              ${item.effect ? `<p style="font-size:13px;color:#b45309;margin-top:8px;">属性变化：${formatEffect(item.effect)}</p>` : ''}
            </div>
            ${item.tags && item.tags.length ? `
              <div class="tag-group">
                ${item.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
              </div>` : ''}
          </article>
        `).join('');
      }

      let finalHtml = '';
      if (gameState.finished) {
        finalHtml = `
          <div class="final-card">
            <h3 style="text-align:center;color:#78350f;font-size:26px;margin:0 0 8px;">序章完结 · 人生结算</h3>
            <p style="text-align:center;color:#78716c;margin:0;font-size:14px;">你走过的每一幕旁白与选择，都完整保留在上方</p>
            <div class="final-attr-grid">
              <div class="final-attr-item"><p class="name">词心</p><p class="val">${gameState.attr.poetry}</p></div>
              <div class="final-attr-item"><p class="name">龙椅</p><p class="val">${gameState.attr.power}</p></div>
              <div class="final-attr-item"><p class="name">情缘</p><p class="val">${gameState.attr.love}</p></div>
              <div class="final-attr-item"><p class="name">民心</p><p class="val">${gameState.attr.people}</p></div>
              <div class="final-attr-item"><p class="name">愁绪</p><p class="val">${gameState.attr.sad}</p></div>
            </div>
            <h4 style="text-align:center;color:#92400e;font-size:18px;margin:24px 0 12px;">你解锁的全部标记</h4>
            <div class="tag-group" style="justify-content:center;">
              ${gameState.tags.length ? gameState.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('') : '<span class="tag">暂无标记</span>'}
            </div>
            <p class="ending-text">${escapeHtml(getEnding())}</p>
            <p class="ending-text" style="font-size:14px;color:#78716c;">从李从嘉到李煜，你走完了序章的全部剧情。南唐国主的人生才刚刚开始，真正的命运还在你手中书写。</p>
            <div class="controls-row">
              <a href="bag.html" class="btn btn-primary">查看属性背包</a>
              <a href="appendix.html" class="btn btn-secondary">查看拓展附录</a>
              <button class="btn btn-danger" onclick="restartGame()">清空存档重开</button>
            </div>
          </div>
        `;
      } else {
        finalHtml = `
          <div class="controls-row">
            <button class="btn btn-primary" id="backBtn">返回继续游玩</button>
            <button class="btn btn-secondary" onclick="restartGame()">重新开始序章</button>
          </div>
        `;
      }

      main.innerHTML = `
        <div style="text-align:center;margin-bottom:40px;">
          <h2 style="font-size:32px;margin:0 0 12px;">我的人生轨迹</h2>
          <p style="color:#78716c;margin:0;">${gameState.finished ? '这里完整记录了你做出的每一个选择，旁白与抉择连缀成篇' : '以下是你目前为止走过的人生片段'}</p>
        </div>
        ${timelineHtml}
        ${finalHtml}
      `;

      const backBtn = document.getElementById('backBtn');
      if (backBtn) backBtn.onclick = () => { previewMode = false; renderScene(); };

      window.scrollTo(0, 0);
    }

    function render() {
      if (previewMode || gameState.finished) {
        renderJourney();
      } else {
        renderScene();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      gameState = loadState();
      render();
    });
  </script>
</body>
</html>
