父亲没有回答。他只是说：“从今以后，你叫李煜。字重光，还是重光。但‘从嘉’那个名字，留给钟山书斋里的少年吧。”
你跪下，叩首。
次日，你跪在灵前，听见群臣在殿外争论。你听见他们说“六皇子仁厚”“六皇子有才”“六皇子是烈祖亲口说过‘他日必大贵’的人”。
你闭上眼睛。你想起很多年前，在钟山书斋里写下的那句：“一壶酒，一竿纶，世上如侬有几人。”
那像是一个遥远的梦。
李从嘉，是那个想写《渔父》的少年。
李煜，是那个不得不坐在龙椅上、却把词写到千古的人。`,
        options: [
          {
            text: '接受命运',
            desc: '你对自己说：既然逃不掉，那就做吧。但你要按自己的方式做。你想起娥皇说的“不要变成你大哥那样的人”。你对自己说：我不会。',
            effect: { poetry: 2, power: 3 },
            tags: ['接受命运'],
            next: 5
          },
          {
            text: '最后写一首词，告别过去',
            desc: '你提笔，写下：“往事只堪哀，对景难排。秋风庭院藓侵阶。一任珠帘闲不卷，终日谁来。”你写完，把笔放下。你对自己说：这是李从嘉最后一次把心事写在纸上的日子。',
            effect: { poetry: 2, sad: 3 },
            tags: ['告别过去'],
            next: 5
          },
          {
            text: '去钟山书斋，最后看一眼',
            desc: '你骑马出城，去了钟山书斋。你站在书斋里，看着那张你写了十年字的书案，看着窗外的雨，看着案上那方砚台。你拿起砚台，想带走。可终究你只把它放回原处。',
            effect: { poetry: 2, sad: 2 },
            tags: ['告别钟山'],
            next: 5
          }
        ]
      },
      {
        title: '终幕 · 登基',
        content: `建隆二年（961年）六月，金陵宫城。天未亮，太庙内烛火通明。你身着玄衣纁裳，冕垂十二旒，立于丹墀之下。殿外群臣肃立；丹墀之下，钟鼓齐鸣，仿佛要把黎明敲碎。
天还没亮，你就醒了。
你在黑暗里睁着眼睛，听更漏一声、一声地漏下去。今天是建隆二年六月，父亲走了已经半年。
今天，你要登基。
礼官跪在榻前，双手捧着衮冕，声音压得很低：“殿下，时辰到了。”
你起身。有人替你穿上玄衣纁裳，系上朱绂，戴上冕旒。十二串玉珠垂落眼前，把整个世界切成十二道细缝。你隔着珠子看出去，烛火、宫墙、人影，全部都变得模糊而冷清。
你想：从今以后，我再看什么，都要隔着这十二串珠子了。
你走出寝殿。钟鼓齐鸣，一声压着一声，像要把这座城从黎明里劈开。
太庙里，香烟缭绕。你跪在列祖列宗的神位前。抬起头，你看见祖父李昪的画像——那个曾把你抱在膝上、说你“此儿有异相，他日必大贵”的人。
你想起父亲临死前那句话：“你祖父说的‘大贵’，也许不是皇位。也许……是别的。”
你想起钟山书斋，想起那首没写完的《渔父》，想起“一壶酒，一竿纶，世上如侬有几人”。
你想起大哥李弘冀的眼睛，想起叔父李景遂的那杯毒酒，想起五个哥哥一个一个走光，只剩你和年幼的从善。
你想起娥皇。想起她在瑶光殿里调弦的样子，想起她说过：“从嘉，无论发生什么，我都陪着你。”也想起她那一句叮嘱：“无论多难，都不要变成你大哥那样的人。”
殿外，宋国的使者立在丹墀之下，隔着珠帘，看不清表情。
礼官高声唱道：“请新君——升殿。”
你站起来。你不再是李从嘉了。
你是李煜。南唐的国主。`,
        options: [
          {
            text: '在太庙当众立誓，守住南唐，不负祖父的预言',
            desc: '你转过身，面对列祖列宗，也面对殿外所有的眼睛。你说：“孙儿李煜，承祖父与先君之业，主江南之政。只要有一口气在，必守此土，不负先祖。”',
            effect: { poetry: 5, sad: 1 },
            tags: ['太庙立誓'],
            next: -1
          },
          {
            text: '先在宋国使者面前表明恭顺，践行父亲的遗命',
            desc: '你登基之前，先命人请宋使入殿。你说：“唐国世为宋臣。先君遗命，谨奉宋室，不敢有二。愿两国永息干戈，江南百姓，得以安耕织。”',
            effect: { power: 5, people: 1 },
            tags: ['奉宋为尊'],
            next: -1
          },
          {
            text: '在群臣叩拜、钟鼓齐鸣之际，越过丹墀，望向钟山的方向',
            desc: '你走上丹墀，接受群臣朝贺。山呼万岁的声音像潮水一样涌上来，把你托得很高，也很空。而你却在那一刻，把目光越过满殿的朱紫，越过宫墙，望向钟山的方向。',
            effect: { love: 4, people: 2 },
            tags: ['回望钟山'],
            next: -1
          }
        ]
      }
    ];

    function sanitizeNarrative(value) {
      return String(value == null ? '' : value)
        .replace(/ +/g, '')
        .replace(/\[\.\.\.\]/g, '……')
        .replace(/\[\.\.\]/g, '……');
    }

    function getDefaultState() {
      return {
        attr: { poetry: 0, power: 0, love: 0, people: 0, sad: 0 },
        tags: [],
        currentScene: 0,
        choices: [],
        finished: false
      };
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function normalizeState(raw) {
      const base = getDefaultState();
      if (!raw || typeof raw !== 'object') return base;

      const next = { ...base, ...raw };
      next.attr = { ...base.attr, ...(raw.attr || {}) };
      next.tags = Array.isArray(raw.tags) ? raw.tags.filter(Boolean).map(sanitizeNarrative) : [];
      next.choices = Array.isArray(raw.choices) ? raw.choices : [];
      next.currentScene = Number.isInteger(raw.currentScene) ? raw.currentScene : 0;
      next.finished = !!raw.finished;

      Object.keys(next.attr).forEach((key) => {
        const value = Number(next.attr[key]);
        next.attr[key] = Number.isFinite(value) ? value : 0;
      });

      if (next.currentScene < 0) next.currentScene = 0;
      if (next.currentScene >= storyLines.length) {
        next.currentScene = storyLines.length - 1;
        next.finished = true;
      }
      return next;
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return normalizeState(JSON.parse(saved));
      } catch (e) {
        console.warn('无法读取 localStorage:', e);
      }
      return getDefaultState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
      } catch (e) {
        console.warn('无法写入 localStorage:', e);
      }
    }

    function restartGame() {
      if (!confirm('确定要重新开始序章吗？当前所有进度和选择将会被清空。')) return;
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) { console.warn(e); }
      window.location.reload();
    }

    let gameState = null;
    let previewMode = false;

    function addTag(tag) {
      const str = String(tag || '').trim();
      if (!str) return;
      if (!gameState.tags.includes(str)) gameState.tags.push(str);
    }

    function applyChoice(opt, scene) {
      if (opt.effect) {
        Object.entries(opt.effect).forEach(([key, value]) => {
          if (gameState.attr[key] !== undefined) {
            gameState.attr[key] += Number(value) || 0;
          }
        });
      }
      if (opt.tags) opt.tags.forEach(addTag);

      gameState.choices.push({
        sceneTitle: sanitizeNarrative(scene.title),
        narration: sanitizeNarrative(scene.content),
        choiceText: sanitizeNarrative(opt.text),
        choiceDesc: sanitizeNarrative(opt.desc),
        effect: opt.effect,
        tags: (opt.tags || []).map(sanitizeNarrative)
      });

      gameState.currentScene = opt.next;
      if (opt.next === -1) {
        gameState.finished = true;
        addTag('序章珍藏');
      }
      saveState();
    }

    function formatEffect(effect) {
      if (!effect) return '';
      return Object.entries(effect)
        .map(([k, v]) => `${ATTR_LABELS[k] || k} ${v > 0 ? '+' : ''}${v}`)
        .join(' / ');
    }

    function getEnding() {
      const a = gameState.attr;
      const ranked = [
        ['poetry', '你最终选择以词心映照山河，把一生的悲欢都写进词句里。千年之后，帝王将相的功业终将随风散去，而你的词作会永远留在世间，成为后人心中一座不朽的山河。'],
        ['power', '你收起了词人的柔软，选择扛起南唐国主的重担。深宫的灯火长明，你将在权谋与国运的漩涡中走出属于自己的帝王之路。'],
        ['love', '你始终以温柔之心待世间人，不论是身边的爱人、朝中的臣子还是境内的百姓，都感受过你的赤诚。温柔是你最强的力量。'],
        ['people', '你始终把百姓放在心上，宁可自己为难，也不肯让江南多一户流离的人家。多年以后，人们仍会因为你的仁政而低声称道。'],
        ['sad', '你在矛盾与挣扎中走完了序章，愁绪深深刻进了生命里。这份敏感与惆怅，最终成为你词作里最动人的底色。']
      ];
      let best = ranked[0];
      ranked.forEach(item => { if (a[item[0]] > a[best[0]]) best = item; });
      return best[1];
    }

    /* ================= 人生轨迹渲染 ================= */
    function renderJourney() {
      const a = gameState.attr;
      const choices = gameState.choices;
      const total = storyLines.length;

      let timelineHtml = '';
      choices.forEach((item, idx) => {
        const narration = sanitizeNarrative(item.narration || '');
        const choiceText = sanitizeNarrative(item.choiceText || '');
        const choiceDesc = sanitizeNarrative(item.choiceDesc || '');
        let effectHtml = '';
        if (item.effect) {
          effectHtml = '<p style="font-size:12px;color:#b45309;margin-top:8px;margin-bottom:0;">属性变化：' + formatEffect(item.effect) + '</p>';
        }
        let tagHtml = '';
        if (item.tags && item.tags.length) {
          tagHtml = '<div class="tag-group">' + item.tags.map(t => '<span class="tag">' + escapeHtml(sanitizeNarrative(t)) + '</span>').join('') + '</div>';
        }
        timelineHtml += '<div class="timeline-card scene-card">' +
          '<div class="timeline-head">' +
            '<div class="scene-badge">' + (idx + 1) + '</div>' +
            '<h4 class="timeline-title">' + escapeHtml(sanitizeNarrative(item.sceneTitle)) + '</h4>' +
          '</div>' +
          '<p class="timeline-narration">' + escapeHtml(narration) + '</p>' +
          '<div class="choice-box">' +
            '<strong>你的选择：</strong>' +
            '<p style="font-weight:500;color:#78350f;margin-bottom:6px;">' + escapeHtml(choiceText) + '</p>' +
            '<p style="font-size:14px;">' + escapeHtml(choiceDesc) + '</p>' +
            effectHtml +
          '</div>' +
          tagHtml +
        '</div>';
      });

      const titleText = gameState.finished ? '序章终局' : '人生轨迹回顾';
      const descText = gameState.finished
        ? '你已经走完了李煜序章的全部旅程，以下是你做出的所有选择。'
        : ('你已完成 ' + choices.length + ' / ' + total + ' 幕，以下是你已走过的选择：');
      let progressHtml = '';
      if (!gameState.finished) {
        const percent = Math.round((choices.length / total) * 100);
        progressHtml = '<p class="progress-tip">进度：' + percent + '%</p><div class="progress-bar"><div class="progress-fill" style="width:' + percent + '%"></div></div>';
      }

      let finalHtml = '';
      if (gameState.finished) {
        const tagsHtml = gameState.tags.map(t => '<span class="tag">' + escapeHtml(sanitizeNarrative(t)) + '</span>').join('');
        finalHtml = '<div class="final-card scene-card">' +
          '<h3 style="text-align:center;font-size:24px;margin-top:0;">序章结局</h3>' +
          '<div class="final-attr-grid">' +
            '<div class="final-attr-item"><p class="name">词心</p><p class="val">' + a.poetry + '</p></div>' +
            '<div class="final-attr-item"><p class="name">龙椅</p><p class="val">' + a.power + '</p></div>' +
            '<div class="final-attr-item"><p class="name">情缘</p><p class="val">' + a.love + '</p></div>' +
            '<div class="final-attr-item"><p class="name">民心</p><p class="val">' + a.people + '</p></div>' +
            '<div class="final-attr-item"><p class="name">愁绪</p><p class="val">' + a.sad + '</p></div>' +
          '</div>' +
          '<p class="ending-text">' + getEnding() + '</p>' +
          '<div class="tag-group" style="justify-content:center;">' + tagsHtml + '</div>' +
        '</div>';
      }

      let backBtnHtml = '';
      if (!gameState.finished) backBtnHtml = '<button class="btn btn-primary" id="backGameBtn">返回继续游玩</button>';

      const main = document.getElementById('mainContent');
      main.innerHTML = '<div class="scene-card" style="text-align:center;margin-bottom:32px;">' +
        '<h2 style="font-size:32px;margin:0 0 12px;">' + titleText + '</h2>' +
        '<p style="color:#78716c;margin:0;">' + descText + '</p>' +
        progressHtml +
        '</div>' +
        timelineHtml +
        finalHtml +
        '<div class="controls-row">' +
          backBtnHtml +
          '<button class="btn btn-danger" onclick="restartGame()">重新开始序章</button>' +
        '</div>';

      const backBtn = document.getElementById('backGameBtn');
      if (backBtn) {
        backBtn.onclick = () => {
          previewMode = false;
          renderScene();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
      }
    }

    /* ================= 游玩视图 ================= */
    function renderScene() {
      const scene = storyLines[gameState.currentScene];
      if (!scene) {
        gameState.finished = true;
        saveState();
        renderJourney();
        return;
      }
      const total = storyLines.length;
      const current = gameState.currentScene + 1;
      const percent = Math.round((gameState.currentScene / total) * 100);
      const cardClass = scene.title.indexOf('楔子') === 0 ? 'bg-amber50' : 'bg-stone50';
      const previewDisabled = gameState.choices.length ? '' : 'disabled';

      const main = document.getElementById('mainContent');
      main.innerHTML = '<div class="scene-card" style="text-align:center;margin-bottom:32px;">' +
        '<h2 style="font-size:32px;margin:0 0 12px;">序章 · 重瞳·钟山隐</h2>' +
        '<p style="color:#78716c;margin:0;">你正在书写李煜的前半段命运，每一个选择都将塑造他的人生轨迹。</p>' +
        '<p class="progress-tip">第 ' + current + ' 幕 / 共 ' + total + ' 幕</p>' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + percent + '%"></div></div>' +
        '</div>' +
        '<div class="' + cardClass + ' scene-card">' +
          '<h3 style="font-size:26px; margin:0 0 20px; line-height:1.4;">' + escapeHtml(sanitizeNarrative(scene.title)) + '</h3>' +
          '<p style="font-size:17px;color:#44403c;margin:0; white-space:pre-wrap; line-height:2;">' + escapeHtml(sanitizeNarrative(scene.content)) + '</p>' +
        '</div>' +
        '<div id="optBox" style="margin-top:32px;"></div>' +
        '<div class="controls-row">' +
          '<button class="btn btn-secondary" id="previewBtn" ' + previewDisabled + '>回顾已走过的轨迹</button>' +
          '<button class="btn btn-danger" onclick="restartGame()">重新开始序章</button>' +
        '</div>';

      const box = document.getElementById('optBox');
      scene.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        let btnContent = '<span style="font-weight:500;font-size:18px;display:block;">' + escapeHtml(sanitizeNarrative(opt.text)) + '</span>';
        if (opt.desc) btnContent += '<p style="font-size:14px;color:#78716c;margin:8px 0 0 0;">' + escapeHtml(sanitizeNarrative(opt.desc)) + '</p>';
        if (opt.effect) btnContent += '<p style="font-size:12px;color:#92400e;margin:10px 0 0 0;">属性变化：' + formatEffect(opt.effect) + '</p>';
        btn.innerHTML = btnContent;
        btn.onclick = () => {
          document.querySelectorAll('.choice-btn').forEach((b) => { b.disabled = true; });
          applyChoice(opt, scene);
          setTimeout(() => {
            if (gameState.finished) {
              previewMode = false;
              renderJourney();
            } else {
              renderScene();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }, 450);
        };
        box.appendChild(btn);
      });

      const previewBtn = document.getElementById('previewBtn');
      if (previewBtn) {
        previewBtn.onclick = () => {
          previewMode = true;
          renderJourney();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
      }
    }

    /* ================= 页面初始化 ================= */
    document.addEventListener('DOMContentLoaded', () => {
      gameState = loadState();
      if (gameState.finished || previewMode) {
        renderJourney();
      } else {
        renderScene();
      }
    });
  </script>
</body>
</html>
